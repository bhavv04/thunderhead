<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="refresh" content="5">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Thunderhead</title>
</head>

<body>

	<h2>thunderhead / status</h2>

	<p>upstream: {{.UpstreamURL}}</p>
	<p>listening: {{.ListenAddr}}</p>

	<hr>

	<p>clients: {{.ClientCount}}</p>
	<p>tarpit threshold: {{.TarpitThreshold}}</p>
	<p>block threshold: {{.BlockThreshold}}</p>

	<hr>

	<table border="1" cellpadding="6" cellspacing="0">
		<thead>
			<tr>
				<th>IP</th>
				<th>Score</th>
				<th>Requests</th>
				<th>Robots</th>
				<th>Action</th>
			</tr>
		</thead>

		<tbody>
			{{.Rows}}
		</tbody>
	</table>

</body>
</html>
